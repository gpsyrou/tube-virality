name: Daily YouTube Data Pipeline

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libatlas-base-dev libopenblas-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r src/requirements.txt

      - name: Run trending.py (Fetch trending videos)
        run: python src/collection/trending.py

      - name: Commit trending data
        run: |
          git add assets/meta/trending
          git diff --cached --quiet || git commit -m "Trending data [$(date -u +%F)]"
          git pull --rebase
          git push

      - name: Run non_trending.py (Sample non-trending videos)
        run: python src/collection/non_trending.py

      - name: Commit non-trending data
        if: always()   # keep partial results if the script died midway
        run: |
          mkdir -p assets/meta/non_trending
          git add assets/meta/non_trending
          git diff --cached --quiet || git commit -m "Non-trending data [$(date -u +%F)]"
          git pull --rebase
          git push
